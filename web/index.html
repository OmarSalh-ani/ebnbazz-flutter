  <script>
    // Clear legacy PWA caches before Flutter loads (fixes FontManifest NetworkError).
    window.__flutterWebBoot = (function () {
      var VERSION_STORAGE_KEY = 'parent-app-build-id';

      function reloadForUpdate() {
        var url = new URL(window.location.href);
        url.searchParams.set('_v', Date.now().toString());
        window.location.replace(url.toString());
        return new Promise(function () {});
      }

      function getCurrentBuildId() {
        var meta = document.querySelector('meta[name="app-build-id"]');
        return meta ? meta.getAttribute('content') || '' : '';
      }

      function checkAppVersion() {
        return fetch('version.json?_=' + Date.now(), { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) {
              return null;
            }
            return response.json();
          })
          .then(function (payload) {
            if (!payload || !payload.version) {
              return;
            }

            var latestBuildId = payload.version;
            var currentBuildId = getCurrentBuildId();
            var storedBuildId = sessionStorage.getItem(VERSION_STORAGE_KEY);

            if (!storedBuildId) {
              if (currentBuildId && currentBuildId !== latestBuildId) {
                sessionStorage.setItem(VERSION_STORAGE_KEY, latestBuildId);
                return reloadForUpdate();
              }
              sessionStorage.setItem(VERSION_STORAGE_KEY, latestBuildId);
              return;
            }

            if (
              storedBuildId !== latestBuildId ||
              (currentBuildId && currentBuildId !== latestBuildId)
            ) {
              sessionStorage.setItem(VERSION_STORAGE_KEY, latestBuildId);
              return reloadForUpdate();
            }
          })
          .catch(function () {});
      }

      function clearLegacyPwa() {
        if (!('serviceWorker' in navigator)) {
          return Promise.resolve();
        }
        return navigator.serviceWorker
          .getRegistrations()
          .then(function (regs) {
            return Promise.all(
              regs.map(function (reg) {
                return reg.unregister();
              }),
            );
          })
          .then(function () {
            if (!('caches' in window)) {
              return;
            }
            return caches.keys().then(function (keys) {
              return Promise.all(
                keys.map(function (key) {
                  return caches.delete(key);
                }),
              );
            });
          });
      }

      function warmFontManifest() {
        return fetch('assets/FontManifest.json', { cache: 'default' }).then(function (r) {
          if (!r.ok) {
            throw new Error('FontManifest HTTP ' + r.status);
          }
          return r.json();
        });
      }

      function startFlutter() {
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.async = true;
        document.head.appendChild(script);
      }

      return clearLegacyPwa()
        .then(checkAppVersion)
        .then(warmFontManifest)
        .then(startFlutter)
        .catch(function (err) {
          console.warn('FontManifest preload failed, starting Flutter anyway:', err);
          startFlutter();
        });
    })();

  <script>

    (function () {

      var loader = document.getElementById('flutter-web-loader');



      function hideWebLoader() {

        if (!loader || loader.classList.contains('fade-out')) {

          return;

        }



        loader.classList.add('fade-out');

        loader.setAttribute('aria-busy', 'false');



        window.setTimeout(function () {

          if (loader && loader.parentNode) {

            loader.parentNode.removeChild(loader);

          }

          document.documentElement.style.overflow = '';

          document.body.style.overflow = '';

        }, 500);

      }



      window.addEventListener('flutter-first-frame', hideWebLoader);

    })();

  </script>
