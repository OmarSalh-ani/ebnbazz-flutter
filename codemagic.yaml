# Codemagic — Flutter iOS App Store automation
#
# Prerequisites (configure in the Codemagic UI, not as yaml secrets):
# - App Store Connect API key integration; its name must match integrations.app_store_connect
# - iOS distribution certificate + App Store provisioning profile for the bundle id
# - The app already exists in App Store Connect
# - The first version must already be published manually; this workflow is for updates
# - App Store listing is Arabic only (ar-SA). Do not add en-US unless that locale is fully filled.
# - Apple review still has to approve. “Automatic” means: submit the build, fill What’s New,
#   and release after approval — it does not skip App Review.
#
# This yaml lives in the Flutter app git root (ParentApp). Do not set working_directory
# unless the Codemagic checkout root is a parent monorepo.

workflows:
  flutter-ios-signed:
    name: Flutter iOS (App Store) — EbnBazz
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Create an App Store Connect integration in Codemagic and put its name here
      app_store_connect: EbnBazz
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.alsalhani.ebnbazz
      vars:
        BUNDLE_ID: com.alsalhani.ebnbazz
        API_BASE_URL: https://teachermobileapi.ebnbazz.com
        MEDIA_BASE_URL: https://admin-api.ebnbazz.com/
        PRIVACY_POLICY_URL: https://ebnbazz.com/privacy-policy
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing on Xcode project
        script: xcode-project use-profiles
      - name: Clean and fetch dependencies
        script: |
          flutter clean
          flutter pub get
      - name: Prepare Arabic App Store metadata
        script: |
          set -euo pipefail
          python3 << 'PY'
          import json
          notes = {
              "language": "ar-SA",
              "text": "تحسينات في الاداء",
              "description": (
                  "تطبيق مركز الإمام عبد العزيز بن باز للعلوم الشرعية.\n\n"
                  "تطبيق رسمي مخصّص لأولياء الأمور والمعلمين في المركز، يسهّل المتابعة والتواصل وإدارة المهام اليومية في مكان واحد.\n\n"
                  "لأولياء الأمور:\n"
                  "• متابعة أبنائهم في المركز\n"
                  "• الاطلاع على التقدّم والمستوى\n"
                  "• استلام الإشعارات والتنبيهات المهمة\n"
                  "• البقاء على تواصل مع المركز بسهولة\n\n"
                  "للمعلمين:\n"
                  "• إدارة الطلاب والحصص\n"
                  "• تسجيل الحضور\n"
                  "• متابعة الأداء والتقدّم\n"
                  "• أدوات تساعد على تنظيم العمل اليومي\n\n"
                  "مزايا مشتركة:\n"
                  "• المصحف الشريف بتجربة قراءة مريحة\n"
                  "• الأذكار\n"
                  "• أخبار وإعلانات المركز\n"
                  "• معلومات المركز\n\n"
                  "حمّل التطبيق الآن وابقَ على اتصال بمركز الإمام عبد العزيز بن باز للعلوم الشرعية."
              ),
              "keywords": "مركز الامام,بن باز,ولي أمر,معلم,قرآن,أذكار,حضور,علوم شرعية,متابعة,كويت",
              "support_url": "https://ebnbazz.com",
          }
          with open("release_notes.json", "w", encoding="utf-8") as f:
              json.dump([notes], f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          cat release_notes.json
      - name: Remove leftover English App Store localizations
        script: |
          set -euo pipefail
          python3 << 'PY'
          import json
          import os
          import subprocess
          import sys

          KEEP_LOCALE = "ar-SA"
          bundle_id = os.environ["BUNDLE_ID"]

          def load_resources(raw: str):
              raw = (raw or "").strip()
              if not raw:
                  return []
              data = json.loads(raw)
              if isinstance(data, list):
                  return data
              if isinstance(data, dict):
                  if isinstance(data.get("data"), list):
                      return data["data"]
                  if "id" in data:
                      return [data]
              return []

          def run_json(*args: str):
              result = subprocess.run(
                  ["app-store-connect", "--json", "-s", *args],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return load_resources(result.stdout)

          apps = run_json(
              "apps",
              "list",
              "--bundle-id-identifier",
              bundle_id,
              "--strict-match-identifier",
          )
          if not apps:
              sys.exit(f"No App Store Connect app found for {bundle_id}")
          app_id = apps[0]["id"]

          versions = run_json(
              "apps",
              "app-store-versions",
              app_id,
              "--platform",
              "IOS",
              "--state",
              "PREPARE_FOR_SUBMISSION",
          )
          if not versions:
              print("No editable App Store version; nothing to clean up")
              raise SystemExit(0)

          for version in versions:
              version_id = version["id"]
              localizations = run_json("app-store-versions", "localizations", version_id)
              for loc in localizations:
                  locale = (loc.get("attributes") or {}).get("locale") or loc.get("locale")
                  loc_id = loc.get("id")
                  if locale == KEEP_LOCALE or not loc_id:
                      continue
                  print(f"Deleting leftover localization {locale} ({loc_id}) from version {version_id}")
                  subprocess.run(
                      [
                          "app-store-connect",
                          "-s",
                          "app-store-version-localizations",
                          "delete",
                          loc_id,
                          "--ignore-not-found",
                      ],
                      check=True,
                  )
          PY
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          rm -f Podfile.lock
          pod install --repo-update
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=MEDIA_BASE_URL=$MEDIA_BASE_URL \
            --dart-define=PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
        cancel_previous_submissions: true
        release_type: AFTER_APPROVAL

  flutter-android-play:
    name: Flutter Android (Google Play) — EbnBazz
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      android_signing:
        # Upload the keystore in Codemagic → Code signing identities, then name it here
        - ebnbazz_keystore
      groups:
        - google_play
      vars:
        PACKAGE_NAME: com.alsalhani.ebnbazz
        API_BASE_URL: https://teachermobileapi.ebnbazz.com
        MEDIA_BASE_URL: https://admin-api.ebnbazz.com/
        PRIVACY_POLICY_URL: https://ebnbazz.com/privacy-policy
      flutter: stable
    scripts:
      - name: Clean and fetch dependencies
        script: |
          flutter clean
          flutter pub get
      - name: Build App Bundle
        script: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=MEDIA_BASE_URL=$MEDIA_BASE_URL \
            --dart-define=PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL
    artifacts:
      - build/**/outputs/bundle/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  flutter-ios-unsigned:
    name: Flutter iOS (compile check, no signing)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build iOS debug without code signing
        script: flutter build ios --debug --no-codesign
    artifacts:
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log
